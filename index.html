<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What should I revise next?</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(1rem, 6vw, 5rem) 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
      color: #222942;
      background: linear-gradient(135deg, #c5e2ff, #e6edff 50%, #dfcff9);
    }

    main {
      max-width: 38rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 2.5rem);
      background: white;
      border-top: 5px solid #6754cb;
      border-radius: 20px;
      box-shadow: 0 16px 45px #39345d24;
    }

    h1 {
      margin: 0 0 1.5rem;
      color: #30295c;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1.15;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 0;
    }

    select, button { font: inherit; }

    select {
      padding: 0.45rem;
      border: 1px solid #aeb6ca;
      border-radius: 8px;
      background: white;
      color: #222942;
    }

    fieldset {
      min-width: 0;
      margin: 1rem 0 1.5rem;
      padding: 0.75rem 1rem;
      background: #f6f5ff;
      border: 1px solid #d9d4ef;
      border-radius: 12px;
    }

    legend { color: #483d84; font-weight: 650; }
    fieldset p { margin: 0.25rem 0; color: #565c72; }
    fieldset label + label { border-top: 1px solid #e2dff1; }

    button {
      width: 100%;
      padding: 0.8rem;
      color: white;
      background: linear-gradient(110deg, #394eae, #6944b0);
      border: 0;
      border-radius: 10px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #48368c; }
    :focus-visible { outline: 3px solid #345bd6; outline-offset: 3px; }

    #result { margin: 0; }

    #result:not(:empty) {
      margin-top: 1.25rem;
      padding: 1rem;
      color: #204e43;
      background: #edf9f4;
      border-left: 4px solid #31806a;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>What should I revise next?</h1>

    <form id="picker">
      <label>
        How much time do you have?
        <select id="minutes">
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15" selected>15 minutes</option>
          <option value="20">20 minutes</option>
        </select>
      </label>

      <fieldset id="ratings">
        <legend>How confident are you in each topic?</legend>
        <p>1 = least confident · 5 = most confident</p>
      </fieldset>

      <button type="submit">Suggest a task</button>
    </form>

    <p id="result" role="status"></p>
  </main>

  <script>
    const tasks = [
      {
        topic: "Action and Error",
        minutes: 10,
        activity: "Write one example of a slip and one of a mistake."
      },
      {
        topic: "Cognitive Load",
        minutes: 15,
        activity: "Sketch a busy screen and remove two things that distract you."
      },
      {
        topic: "Conversational Interfaces",
        minutes: 20,
        activity: "Write a short dialogue where an app clears up an unclear request."
      }
    ];

    const form = document.querySelector("#picker");
    const ratings = document.querySelector("#ratings");
    const result = document.querySelector("#result");

    for (const topic of new Set(tasks.map(task => task.topic))) {
      const label = document.createElement("label");
      label.textContent = topic;

      const select = document.createElement("select");
      select.name = topic;

      for (let score = 1; score <= 5; score++) {
        select.add(new Option(score, score));
      }

      select.value = "3";
      label.append(select);
      ratings.append(label);
    }

    form.addEventListener("input", () => {
      result.textContent = "Choices updated. Select “Suggest a task” to check again.";
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      const available = Number(document.querySelector("#minutes").value);
      const scores = new FormData(form);
      const confidence = task => Number(scores.get(task.topic));
      const options = tasks.filter(task => task.minutes <= available);

      if (options.length === 0) {
        const shortest = Math.min(...tasks.map(task => task.minutes));
        result.textContent =
          `You chose ${available} minutes. The shortest task takes ${shortest} minutes.`;
        return;
      }

      options.sort((a, b) => confidence(a) - confidence(b) || a.minutes - b.minutes);
      const best = options[0];

      result.textContent =
        `${best.activity} You rated ${best.topic} ${confidence(best)}/5. ` +
        `This ${best.minutes}-minute task fits your ${available} minutes.`;
    });
  </script>
</body>
</html>
